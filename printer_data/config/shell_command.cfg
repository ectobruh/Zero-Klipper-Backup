timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

    [gcode_shell_command get_ip]
command: /home/sovol/get_ip.sh
timeout: 2.
verbose: True
[gcode_macro _GET_IP]
