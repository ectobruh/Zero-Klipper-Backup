#---------------------------------------------------------------------------------
  
[mcu] 
canbus_uuid: 0d1445047cdd

[mcu extruder_mcu]
canbus_uuid: 61755fe321ac

[virtual_sdcard] 
path: /home/sovol/printer_data/gcodes/

[printer]
kinematics: corexy
max_velocity: 1200           
max_accel: 20000             
minimum_cruise_ratio: 0.5    
max_z_velocity: 20           
max_z_accel: 500             
square_corner_velocity: 5.0  

[extruder]
step_pin: extruder_mcu:PA8   
dir_pin: extruder_mcu:PA9
enable_pin: !extruder_mcu: PA11   
rotation_distance: 6.5 
microsteps: 16                
full_steps_per_rotation: 200 
nozzle_diameter: 0.400        
filament_diameter: 1.75  
max_extrude_only_velocity: 22
max_extrude_only_distance: 150     
max_extrude_cross_section: 60
heater_pin: extruder_mcu:PB7 
sensor_type: my_thermistor_e  
pullup_resistor: 11500
sensor_pin: extruder_mcu:PA5  
min_temp: 0   
max_temp: 355                
max_power: 1.0                
min_extrude_temp: 150         
#control : pid
#pid_kp : 34.838
#pid_ki : 4.976
#pid_kd : 62.823
pressure_advance: 0.025       
pressure_advance_smooth_time: 0.025   

[tmc2209 extruder]
uart_pin: extruder_mcu:PA12
# interpolate: True             
# run_current: 0.8                       
uart_address: 3
sense_resistor: 0.150   
interpolate: False
run_current: 0.7
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 10
            
[stepper_x]   
step_pin: PE1
dir_pin: !PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: ^extruder_mcu:PA10
position_min: -10
position_endstop: -10
position_max: 155
homing_speed: 90
homing_retract_dist: 2

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
# interpolate: false
# run_current: 3.5
# sense_resistor: 0.05
# stealthchop_threshold: 999999 
interpolate: False
run_current: 2.404
driver_TBL: 2
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 3 

[stepper_y]  
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: ^PD1
position_min: -2
position_endstop: 152.5
position_max: 152.5
homing_speed: 90
homing_retract_dist: 2

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
# interpolate: false
# run_current: 3.5
# sense_resistor: 0.05 
# stealthchop_threshold: 999999
interpolate: False
run_current: 2.404
driver_TBL: 2
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 3 

[stepper_z] 
step_pin:PA5
dir_pin: !PA4   
enable_pin:!PA7
rotation_distance: 4             
microsteps: 16 
endstop_pin: probe:z_virtual_endstop  
position_max: 155
position_min: -1.5
homing_speed: 10.0
homing_retract_dist: 3.0
homing_retract_speed: 5.0
second_homing_speed: 5

[tmc2209 stepper_z]
uart_pin: PA6
# interpolate: true             
# run_current: 1.5                  
sense_resistor: 0.150          
uart_address:3
interpolate: False
run_current: 0.7
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 6
driver_HEND: 3 

[adc_temperature my_thermistor_e]
temperature1:25
resistance1:1268.60
temperature2:180
resistance2:1920.98
temperature3:300
resistance3:2398.52

[verify_heater extruder]      
max_error: 120                
check_gain_time:20           
hysteresis: 5                
heating_gain: 2               

# [filament_switch_sensor filament_sensor]
# pause_on_runout: False
# switch_pin: PB2
# runout_gcode:
#     M117 Out of Filament
#     CONTINUE_PRINT_D D={200}

[filament_switch_sensor filament_sensor]
switch_pin: PB2
pause_on_runout: False
insert_gcode:
    { action_respond_info("Insert Detected") }  
runout_gcode:
    { action_respond_info("Runout Detected") }
    {% if printer.print_stats.state == "printing" %}
      _FIL_CHANGE_PARK
    {% endif %}

[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5762.6

[heater_bed]
heater_pin: PD12
sensor_type: my_thermistor  
sensor_pin: PC5
max_power: 1.0               
min_temp: -0            
max_temp: 125             
#control : pid
#pid_kp : 53.071
#pid_ki : 1.792
#pid_kd : 442.428

[verify_heater heater_bed]      
max_error: 120                
check_gain_time:20           
hysteresis: 5                
heating_gain: 2 

# [fan_generic fan0] # fan
# pin: extruder_mcu:PB0
# max_power: 1.0
# cycle_time: 0.015

# [fan_generic fan2] # auxiliary fan
# pin: PE11
# max_power: 1.0
# cycle_time: 0.015

# [fan_generic fan3]
# pin: PE14
# max_power: 1.0
# cycle_time: 0.015

[multi_pin fan_pins]
pins: extruder_mcu:PB0

[fan]
pin:multi_pin: fan_pins
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
off_below: 0.10

[fan_generic fan2] 
pin: PE11
tachometer_pin: PE13
tachometer_ppr: 1
tachometer_poll_interval: 0.0075
max_power: 1.0

[fan_generic fan3]
pin: PE14
max_power: 1.0
cycle_time: 0.015

[led Printer_Lights]
white_pin: PD13
cycle_time: 0.001
initial_WHITE: 1.0

